# ==============================================================================
# CONTINUOUS INTEGRATION
# ==============================================================================
# LEARNING NOTE: this workflow runs automatically on every pull request and
# every push to main. Its job is to catch problems BEFORE they merge:
# lint errors, type errors, failing tests, and a broken production build.
# Branch protection rules on GitHub can require this workflow to pass before
# a PR is mergeable — ask an interviewer about this and you'll usually get
# a nod of approval, since "does this project have CI" is one of the first
# things reviewers check on a portfolio repo.
# ==============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the still-running CI from the first
# push, instead of wasting minutes finishing a check for code that's
# already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-e2e:
    runs-on: ubuntu-latest
    # Spins up a real, ephemeral Postgres database for the lifetime of this
    # job — the same idea as docker-compose.yml for local development, but
    # managed by GitHub Actions instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photo_portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/photo_portfolio
      # A real secret is never needed in CI — this is just enough for
      # NextAuth to boot without throwing its "missing secret" error.
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production-use
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: placeholder
      AWS_SECRET_ACCESS_KEY: placeholder
      AWS_S3_BUCKET_NAME: placeholder-bucket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build and run E2E smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
